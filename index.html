<!doctype html>
<html lang="en" >
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>withU — Expert Guidance. Trusted Support. Multi-Vendor Marketplace</title>
    <meta name="description" content="Multi-vendor marketplace connecting customers with verified professionals and organizations across essential service sectors: Doctor Consultations, IT, Engineering, Hajj & Umrah, Ruqyah, Legal & Education." />
    <meta property="og:title" content="withU — Expert Guidance. Trusted Support." />
    <meta property="og:description" content="Verified professionals, transparent statuses, and escrowed money that only moves when it should." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!--
      Favicon = the same final_logo the Navbar and Footer render.

      The href is RELATIVE (`./src/images/…`), which is what makes Vite treat
      it as an asset: it fingerprints the file and rewrites this href to
      /assets/final_logo-<hash>.jpeg at build time. An absolute `/src/...`
      would be left untouched and 404 in production, which is exactly how the
      old `/client/src/images/final_logo.jpeg` broke — the SPA rewrite caught
      the 404 and handed the browser index.html instead of an image.

      favicon.ico stays in public/ because browsers request /favicon.ico on
      their own even with no <link>, and Windows pinned sites and older
      clients want a real .ico. It is a committed 16/32/48px artifact built
      from this same logo; regenerate it if the logo ever changes.
    -->
    <link rel="icon" type="image/jpeg" href="./src/images/final_logo.jpeg">
    <link rel="apple-touch-icon" href="./src/images/final_logo.jpeg">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <meta name="theme-color" content="#34C759">
  </head>
  <body class="bg-white text-[#111827] antialiased selection:bg-[#34C759]/20 selection:text-[#111827]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
